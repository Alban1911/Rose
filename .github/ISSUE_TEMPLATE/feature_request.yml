name: Feature request
description: Suggest an improvement or new capability for Rose
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search existing issues and pull requests first.

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What problem would this feature solve? Concrete examples are especially helpful.
      placeholder: I often need to... but currently...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work from a user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or links that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and pull requests and did not find a duplicate.
          required: true
        - label: This request is about Rose itself, not general League support or obtaining third-party patcher files.
          required: true
