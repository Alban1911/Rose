name = "rose-party-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Keep Workers Logs on, so errors come with their cause in the dashboard
[observability]
enabled = true

# One log per Worker and room invocation was ~70% of the 200K events/day
# allowance: the room's own lines already trace each connection
[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "PartyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]
